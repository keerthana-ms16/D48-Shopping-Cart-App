
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Shopping Store</h1>
        <p>Choose your favourite products</p>
    </header>

    <main>
        <section class="products-section">
            <h2>Available Products</h2>
            <div class="category-buttons">
    <button class="category-btn active" data-category="all">All</button>
    <button class="category-btn" data-category="women">Women</button>
    <button class="category-btn" data-category="men">Men</button>
</div>
            <div id="product-list" class="product-list"></div>
        </section>

        <section class="cart-section">
            <h2>My Shopping Cart</h2>
            <p id="cart-count">Items: 0</p>

            <p id="empty-message">Your cart is empty. Start shopping and add your favourite products!</p>

            <div id="cart-items"></div>

            <div class="cart-total">
                <h3>Total: ₹<span id="total-price">0</span></h3>
                <button id="clear-cart">Clear Cart</button>
                <button id="checkout">Place Order</button>
            </div>

            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>My Shopping Store | Mini Shopping App</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
